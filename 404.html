<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Julex</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <img src="assets/images/logo.svg" alt="Julex Logo">
                    <span>Julex</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container" style="height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
        <div class="fade-in" style="font-size: 8rem; font-weight: 800; color: var(--primary); line-height: 1;">404</div>
        <h1 class="fade-in delay-1" style="margin-bottom: 1.5rem;">Oops! Page Not Found</h1>
        <p class="fade-in delay-2" style="color: var(--text-muted); max-width: 500px; margin-bottom: 2.5rem;">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="index.html" class="btn btn-primary fade-in delay-3">Back to Homepage</a>
        
        <div class="fade-in delay-4" style="margin-top: 4rem; width: 100%; max-width: 600px; height: 200px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
            [ Beautiful Illustration Placeholder ]
        </div>
    </main>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
